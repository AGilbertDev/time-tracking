name: Tests

on:
  pull_request:
  # A push to the default branch saves the coverage baseline the next pull
  # request compares against.
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: AGilbertDev/test-report@v1
        with:
          threshold: 80
